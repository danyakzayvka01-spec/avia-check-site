<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Проверка авиабилета</title>
  <style>
    :root {
      --ink: #142033;
      --muted: #627084;
      --blue: #1463d8;
      --blue-dark: #0d3f91;
      --ok: #117a48;
      --ok-bg: #eaf8ef;
      --bad: #b42318;
      --bad-bg: #fff0ed;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: #dcecf8 url("airplane-hero.png") center / cover no-repeat fixed;
      overflow-x: hidden;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      content: "";
      background:
        linear-gradient(90deg, rgba(244, 249, 255, 0.96) 0%, rgba(244, 249, 255, 0.84) 38%, rgba(244, 249, 255, 0.26) 78%),
        linear-gradient(180deg, rgba(10, 37, 77, 0.18), rgba(255, 255, 255, 0.1));
    }

    main {
      display: grid;
      min-height: 100vh;
      place-items: center start;
      padding: 32px;
    }

    .shell {
      width: min(100%, 560px);
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 34px;
      font-weight: 800;
    }

    .mark {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      color: white;
      background: var(--blue);
      border-radius: 8px;
      box-shadow: 0 16px 36px rgba(20, 99, 216, 0.28);
    }

    h1 {
      max-width: 12ch;
      margin: 0 0 18px;
      font-size: clamp(42px, 8vw, 76px);
      line-height: 0.92;
    }

    .lead {
      max-width: 480px;
      margin: 0 0 30px;
      color: #34445b;
      font-size: 18px;
      line-height: 1.6;
    }

    .checker {
      width: min(100%, 520px);
      padding: 20px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 8px;
      box-shadow: 0 24px 70px rgba(38, 66, 101, 0.22);
      backdrop-filter: blur(16px);
    }

    form {
      display: grid;
      gap: 14px;
    }

    label {
      color: #2b3850;
      font-size: 14px;
      font-weight: 700;
    }

    .row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
    }

    input {
      width: 100%;
      min-width: 0;
      height: 54px;
      padding: 0 16px;
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      font-weight: 650;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(22, 32, 51, 0.16);
      border-radius: 8px;
      outline: none;
    }

    input:focus {
      border-color: rgba(20, 99, 216, 0.72);
      box-shadow: 0 0 0 4px rgba(20, 99, 216, 0.14);
    }

    button {
      display: inline-grid;
      height: 54px;
      min-width: 148px;
      padding: 0 22px;
      place-items: center;
      color: white;
      font: inherit;
      font-weight: 800;
      background: linear-gradient(135deg, var(--blue), var(--blue-dark));
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 14px 28px rgba(20, 99, 216, 0.25);
    }

    .result {
      display: none;
      margin-top: 16px;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid transparent;
    }

    .result.is-visible {
      display: grid;
      gap: 8px;
    }

    .result strong {
      font-size: 18px;
    }

    .result p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .result.found {
      color: var(--ok);
      background: var(--ok-bg);
      border-color: rgba(17, 122, 72, 0.22);
    }

    .result.missing {
      color: var(--bad);
      background: var(--bad-bg);
      border-color: rgba(180, 35, 24, 0.18);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      place-items: center;
      padding: 24px;
      background: rgba(8, 18, 33, 0.62);
      backdrop-filter: blur(10px);
    }

    .modal.is-open {
      display: grid;
    }

    .ticket-window {
      width: min(100%, 760px);
      max-height: min(92vh, 920px);
      overflow: hidden;
      background: white;
      border-radius: 8px;
      box-shadow: 0 32px 90px rgba(8, 18, 33, 0.38);
    }

    .ticket-window header {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(22, 32, 51, 0.12);
    }

    .ticket-window h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.25;
    }

    .close-modal {
      width: 40px;
      min-width: 40px;
      height: 40px;
      padding: 0;
      color: var(--ink);
      background: #f0f4f8;
      border: 1px solid rgba(22, 32, 51, 0.12);
      box-shadow: none;
    }

    .ticket-frame {
      max-height: calc(min(92vh, 920px) - 69px);
      overflow: auto;
      background: #f6f8fb;
    }

    .ticket-frame img {
      display: block;
      width: 100%;
      height: auto;
      background: white;
    }

    .foot {
      margin-top: 14px;
      color: rgba(43, 56, 80, 0.78);
      font-size: 13px;
    }

    @media (max-width: 680px) {
      main {
        align-items: start;
        padding: 24px 16px;
      }

      body {
        background-position: 62% center;
      }

      body::before {
        background:
          linear-gradient(180deg, rgba(244, 249, 255, 0.95) 0%, rgba(244, 249, 255, 0.88) 48%, rgba(244, 249, 255, 0.52) 100%),
          linear-gradient(180deg, rgba(10, 37, 77, 0.16), rgba(255, 255, 255, 0.1));
      }

      h1 {
        max-width: 10ch;
        font-size: 48px;
      }

      .lead {
        font-size: 16px;
      }

      .checker {
        padding: 16px;
      }

      .row {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="shell" aria-labelledby="page-title">
      <div class="brand" aria-label="AirCheck">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="25" height="25" fill="none">
            <path d="M3 13.5 21 4l-5.2 16-4.3-6.2L5.2 17 3 13.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </span>
        <span>AirCheck</span>
      </div>

      <h1 id="page-title">Проверка авиабилета</h1>
      <p class="lead">Введите номер билета, чтобы увидеть статус регистрации в базе бронирования.</p>

      <div class="checker">
        <form id="ticketForm" novalidate>
          <label for="ticketNumber">Номер билета</label>
          <div class="row">
            <input id="ticketNumber" name="ticketNumber" type="text" autocomplete="off" placeholder="Введите номер билета" required>
            <button type="submit">Проверить</button>
          </div>
        </form>

        <div id="result" class="result" role="status" aria-live="polite"></div>
        <div class="foot">Статус показывается только для заданного номера билета.</div>
      </div>
    </section>
  </main>

  <div id="ticketModal" class="modal" aria-hidden="true">
    <section class="ticket-window" role="dialog" aria-modal="true" aria-labelledby="ticket-title">
      <header>
        <h2 id="ticket-title">Билет найден: 160459290045</h2>
        <button class="close-modal" type="button" aria-label="Закрыть билет" title="Закрыть билет">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </header>
      <div class="ticket-frame">
        <img src="ticket-photo.jpg" alt="Фотография найденного авиабилета">
      </div>
    </section>
  </div>

  <script>
    const VALID_TICKET_NUMBER = "160459290045";

    const form = document.querySelector("#ticketForm");
    const input = document.querySelector("#ticketNumber");
    const result = document.querySelector("#result");
    const ticketModal = document.querySelector("#ticketModal");
    const closeModal = document.querySelector(".close-modal");

    function normalizeTicket(value) {
      return value.trim().replace(/\s+/g, "").toUpperCase();
    }

    function openTicketModal() {
      ticketModal.classList.add("is-open");
      ticketModal.setAttribute("aria-hidden", "false");
      closeModal.focus();
    }

    function closeTicketModal() {
      ticketModal.classList.remove("is-open");
      ticketModal.setAttribute("aria-hidden", "true");
    }

    function renderFound(ticketNumber) {
      result.className = "result found is-visible";
      result.innerHTML = `
        <strong>Билет найден</strong>
        <p>Номер ${ticketNumber} есть в системе.</p>
      `;
      openTicketModal();
    }

    function renderMissing(ticketNumber) {
      result.className = "result missing is-visible";
      result.innerHTML = `
        <strong>Билет не найден</strong>
        <p>Номер ${ticketNumber || "не указан"} отсутствует в системе.</p>
      `;
      closeTicketModal();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const enteredTicket = normalizeTicket(input.value);

      if (enteredTicket && enteredTicket === normalizeTicket(VALID_TICKET_NUMBER)) {
        renderFound(VALID_TICKET_NUMBER);
      } else {
        renderMissing(input.value.trim());
      }
    });

    closeModal.addEventListener("click", closeTicketModal);

    ticketModal.addEventListener("click", (event) => {
      if (event.target === ticketModal) {
        closeTicketModal();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeTicketModal();
      }
    });
  </script>
</body>
</html>
